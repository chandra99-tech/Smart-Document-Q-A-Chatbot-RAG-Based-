server:
  port: 8080

spring:
  application:
    name: docmind-backend

  datasource:
    url: jdbc:mysql://localhost:3306/docmind?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: welcome
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

# JWT
app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-at-least-256-bits}
    expiration-ms: 86400000   # 24 hours

# Python RAG microservice
rag:
  service:
    base-url: ${RAG_SERVICE_URL:http://localhost:8000}

# CORS
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

logging:
  level:
    com.docqa: DEBUG
    org.springframework.security: INFO
