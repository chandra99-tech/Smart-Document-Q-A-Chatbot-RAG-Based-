version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: docmind-postgres
    environment:
      POSTGRES_DB: docmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Python RAG Microservice ─────────────────────────────────────────────────
  rag-service:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: docmind-rag
    env_file:
      - ./backend-python/.env
    ports:
      - "8000:8000"
    volumes:
      - rag_uploads:/app/uploads
      - rag_faiss:/app/faiss_index
      - rag_chroma:/app/chroma_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Spring Boot API Gateway ─────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: docmind-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/docmind
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      RAG_SERVICE_URL: http://rag-service:8000
      JWT_SECRET: change-me-in-production-super-secret-key-256bits
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_healthy

  # ── React Frontend (Production build served via Nginx) ──────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docmind-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  rag_uploads:
  rag_faiss:
  rag_chroma:
